# Trunk config for the web (wasm) build of Open CAD Studio (issue #45).
#
# Build:   trunk build --release
# Dev:     trunk serve
#
# Requires: rustup target add wasm32-unknown-unknown
#           cargo install trunk wasm-bindgen-cli

[build]
target = "web-app.html"
dist = "dist/app"
# This fork's web build is a project page, served under the repository's
# name; upstream's site has a domain of its own and serves the app from
# /app/. Every address the build writes is relative to this.
public_url = "/OpenCADStudio/app/"
html_output = "index.html"

[tools]
# Binaryen shrinks the module by a third and, more importantly for a phone,
# leaves far fewer functions and table entries for the browser to compile
# before the first frame. Point TRUNK_TOOLS_WASM_OPT at a download of
# https://github.com/WebAssembly/binaryen when it is not on PATH.
wasm_opt = "version_123"
wasm_bindgen = "0.2.108"

[[hooks]]
stage = "post_build"
command = "sh"
command_arguments = ["scripts/build-web-worker.sh"]

[serve]
# Cross-origin isolation headers enable SharedArrayBuffer, which wasm threads
# (rayon) need. GitHub Pages cannot set these; a self-hosted server (e.g. the
# Open-AEC host) can. Without them the app still runs single-threaded.
headers = { "Cross-Origin-Opener-Policy" = "same-origin", "Cross-Origin-Embedder-Policy" = "require-corp" }
